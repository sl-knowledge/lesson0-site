id: en-l1
title: 英语第一课 · 教师用：按中文的方式写英语，会丢掉什么？
file: teacher/en-l1.md
lead: 这一页是英语第一课的教师后台：预设路径、逐级提示与示范答案。学生不应预先看到本页内容。
blocks:
- type: banner
  tone: teacher
  title: 仅教师使用 · 请勿投屏或分发本页链接
  text: 本页包含预设教学路径、逐级提示与示范答案。站点是纯静态页面，没有访问控制：请不要向学生投屏此页，也不要把本页链接发给学生。
- type: para
  text: '**对应教材：** 《英语第一课_v2_学生版.pdf》及同名学生版 Markdown，共 4 页。'
- type: para
  text: '**使用限制：** 教师版包含答案、提示顺序和教学边界。**不要提前发给学生，也不要把所有问题一次性念出来。**'
- type: heading
  level: 2
  text: 1. 本课的定位：从学生真实的偏差出发
- type: para
  text: 中文母语者最根本的认知偏差是：**"我心里组织好的中文，换成英语单词就行了。"** 所以他写出来的是 *Here is very cold*、*Government react too slow,
    people very angry*。在中文的条件下，这样组织完全没有问题，所以他并不觉得自己错了。即使被纠正，他也只会把正确形式当作"怪规矩"去背，心里并不接受。
- type: para
  text: 本课不先教规则，而是：
- type: list
  marker: ordered
  items:
  - 让学生**先按自己的方式写**，暴露真实的偏差；
  - 把**中文的条件和英语的条件**摆出来；
  - 让学生当一回"英语听者"，**亲眼看到**按中文写的英语会被误读、会丢掉信息；
  - 在英语的条件下重新说，体会英语的形式是在这些条件下长出来的；
  - 用欧化中文照镜子：反方向也一样会丢东西。
- type: para
  text: 核心信息：**按中文的样子写英语不是"不行"，而是会丢掉英语靠形式承载的东西。** 学生看到损失，才会真心接受另一种写法。
- type: heading
  level: 3
  text: 真正的学习目标
- type: list
  marker: ordered
  items:
  - '**观念层：** 中文的"流水"和英语的"骨架"是两套条件下各自合理的解法；每种语言的形式都为自己的条件优化，搬到另一套条件下就会有损失。'
  - '**内容层：** 英语句子先搭"主语 + 一个主要动词"的骨架，位置必须填满；由此推出形式主语 it、词上的时间标签、显性的连接词，以及把整件事压成名词放进主语位置。'
  - '**价值层：** 学生判断"别扭"时开始换参照系：问"在它的条件下，这样写保住了什么"。'
  - '**方法层：** 学生能用"当一回英语听者"的办法检查自己的句子，并在至少一个停顿点自己提出有依据的问题。'
- type: heading
  level: 2
  text: 2. 教师预先掌握的真实机制（不要直接当讲义）
- type: list
  items:
  - '**中文是话题优先型语言，英语是主语优先型语言**（Li 和 Thompson，1976；赵元任认为中文的主语就是话题）。中文句子按"话题—说明"和意义顺序组织，小句可以一段段串联（吕叔湘的"流水句"）；英语以"主语
    + 限定动词"为主干，其余成分按语法关系挂在主干上。'
  - '**英语不能省略主语**，没有语义主语时用形式主语 it（天气、时间、距离、"这里很冷"这类情况）或 there（存在句）。'
  - '**空位在英语里会被误读**：英语听者按骨架来理解，会预期每个位置被填上。*Here is…* 在英语中通常用于递上或介绍一样东西（*Here is your coffee*），所以 *Here
    is very cold* 会先让人等一个名词出现。**但不要夸大：** 母语者大多仍能猜出意思，只是听起来不对。本课要说明的是"信号错了、信息丢了"，而不是"完全听不懂"。'
  - '**英语靠词上的标签和显性连接词传递信息**：时间（*were*、*-ed*）、确定性（*the*）、关系（*because*）。中文可以把这些交给语境。'
  - '**英语（尤其书面语）大量名词化**（Halliday 的"语法隐喻"）。日常口语名词化少，常用 *because*、*and* 串联。所以 ③ 和 ③'' 两种说法都要给学生看：一种压缩成大名词，一种用连接词把关系说出来，都是在骨架条件下的合理解法。'
  - '**"骨架规则"是教学上的简化**：口语里有 *Raining again.* 这类省略，祈使句没有主语，主语和动词之间可以有副词。这些留给学生以后自己发现，不要在本课否认它们。'
- type: heading
  level: 2
  text: 3. 教学流程和按需提示
- type: heading
  level: 3
  text: 第 1 页｜先让学生按自己的方式写
- type: para
  text: '**不要给任何提示，也不要评价对错。** 学生写下的句子就是本课最重要的材料。'
- type: list
  items:
  - 如果学生写出了中文式的英语，第 2 页就直接用他自己的句子来做"英语听者"实验。
  - 如果学生已经写得很地道（比如早就会说 *It is raining*），就用第 2 页列出的典型写法 A、B，并问："你身边有人这样写吗？你以前这样写过吗？"同时记录：这个学生的偏差可能在别处，以后的课要找到它。
- type: para
  text: '**两套条件表：** 只读一遍，不要展开讲。它的作用是给第 2 页的实验提供参照。强调最后一句："两套条件都是好办法。"'
- type: heading
  level: 3
  text: 第 2 页｜当一回"英语听者"
- type: para
  text: '**关键：** 学生要真正站到英语听者的位置上，只按英语的条件去理解，不能用中文的"心照不宣"去补。'
- type: para
  text: '**若学生卡住（一旦学生开始自己想就停止）：** '
- type: table
  rows:
  - - 1 轻提示
    - '"Here is your coffee 后面跟的是什么？"'
    - '"这句话里，哪个词告诉你是什么时候？"'
  - - 2 较明确
    - '"那 Here is 后面，听的人在等一个什么样的词？"'
    - '"''反应慢''和''生气''之间，有没有一个词说出它们的关系？"'
  - - 3 半句
    - '"听的人会以为''这里是很冷的……''"'
    - '"在中文里你自己就能补上，可是英语听者只能……"'
  - - 4 示范
    - 教师示范分析一个，再让学生分析另一个。示范的部分不记为学生的发现。
    - 同左
  headers:
  - 级别
  - 小问题 2（Here is…）
  - 小问题 3（Government react…）
- type: para
  text: '**骨架规则游戏（小问题 4、5）：** '
- type: list
  items:
  - 明确说明：**这是一个人为设计的小游戏，不是正常的中文。**
  - 学生自己选择占位记号。如果学生发明了别的合理办法（比如小问题 5 用"老百姓"当主语，把原因放进"因为……"），先承认它有效，这正是 ③' 的思路。
- type: heading
  level: 3
  text: 第 3 页｜真实英语与学生发明的交接
- type: list
  marker: ordered
  items:
  - 先让学生对照 ①—③'，自己找出 it、大名词主语、because。
  - '**交接仪式：** 学生亲手在表里写下自己的记号，再亲手抄写对应的英语（○ ↔ it；"政府的慢反应" ↔ *The government''s slow response*）。不要替他填，也不要只口头宣布。'
  - 交接完成以后，**不再使用学生自创的记号**。
- type: para
  text: '**小问题 7 参考答案：** *were* → 时间（过去）；*because* → 关系（原因）；*the government* → 是哪一个政府（确定性）。'
- type: note
  tone: green
  title: ''
  text: 交接时可以这样说："你刚才在这套条件下想出的办法，英语也想到了。英语之所以长成这个样子，是因为它要在这些条件下保住这些信息。"
- type: heading
  level: 3
  text: 第 4 步｜照镜子（本课最关键的一题）
- type: para
  text: 预期学生会觉得"政府的迟缓的反应使老百姓生气了"**别扭**。这个感觉要**肯定**。然后引导学生看到：按英语的样子写中文，中文丢掉了简洁、节奏和自然的流动；原句"政府反应太慢，老百姓很生气"在中文的条件下是更好的解法。
- type: para
  text: '**目标不是让学生觉得英语"更好"，而是让他明白：每种语言的形式都是为自己的条件优化的，"别扭"是相对于某一套条件的。**'
- type: heading
  level: 3
  text: 第 5 步｜预测（有区分力的题）
- type: table
  rows:
  - - 这里很安静。
    - '*It is quiet here.*'
    - '**有区分力。** 中文式写法是 *Here is very quiet*。如果学生写出 it，说明骨架规则开始取代话题思路。只记录，不用规则纠正；可以问："当一回英语听者，Here is
      后面在等什么？"'
  - - 天黑了。
    - '*It is getting dark.*'
    - 检验能否把 it 迁移到新的自然现象上
  - - 他病了，没来上学。
    - '*He didn''t come to school because he was sick.*'
    - 检验能否把关系（because）和时间（was）都显性地说出来。*He was sick, so he didn't come to school* 也正确。中文式写法常见 *He sick,
      didn't come to school*。注意：本题词表里给了 because，看学生会不会主动用它
  headers:
  - 题目
  - 参考答案
  - 说明
- type: heading
  level: 2
  text: 4. 学生提不出问题时的逐级支架（最后一题）
- type: table
  rows:
  - - 0 自主
    - 只留时间
    - 自己提出问题
  - - 1 轻提示
    - '"今天哪个地方你还觉得没想通？"'
    - 自己选主题
  - - 2 对比提示
    - '"除了主语、时间、关系，英语还可能在哪里要求你把东西说出来？"'
    - 指出要检查的地方
  - - 3 半句
    - '"英语一定要分 he 和 she，是不是也因为……"'
    - 补完并说出猜想
  - - 4 示范
    - 教师示范一个可以检验的问题
    - 学生提出一个不同的相邻问题
  headers:
  - 级别
  - 教师给什么
  - 学生还要完成什么
- type: para
  text: '**不要把教师示范的问题记成学生自己提出的。**'
- type: heading
  level: 2
  text: 5. 每次要记录的
- type: list
  marker: ordered
  items:
  - '**第 1 页的原始写法：** 学生自己写出的三句英语，原样保存。这是他真实偏差的记录，也是以后对比进步的基线。'
  - '**英语听者实验：** 学生能否自己指出误读和丢失的信息，需要哪一级支架。'
  - '**交接：** 能否亲手完成记号与 it、大名词主语的对应。'
  - '**价值判断：** 小问题 8 里，学生是否意识到"别扭"是相对于某一套条件的。'
  - '**预测：** 三道题的答案和把握程度。**把握高却答错的情况最有价值**，它就是一个真实的异常。'
  - '**自主性：** 最后一题的问题原话、问题来源、需要的支架级别；挑战 2 里学生自己找到的"中文式英语"。'
- type: heading
  level: 2
  text: 6. 刻意留到以后的内容
- type: list
  items:
  - '**第二课建议：骨架上的其他必填位置。** he/she、单复数 -s、动词的时态、冠词。核心观念：英语每一句都要把状态说全（谁、男女、几个、什么时候、哪一个），中文只说变化的部分。仍然用"英语听者"的办法看损失；练习时"拿掉拐杖"，比如不出现
    yesterday，让动词形式本身承担时间信息。'
  - 英语修饰语的位置（*the book I bought yesterday*）与中文"我昨天买的书"相反。
  - there 存在句；口语里的省略（*Raining again.*）。
  - 以上内容学生如果在最后一题里自己问到，记为异常型问题。
- type: heading
  level: 2
  text: 7. 给以后继续写教材的 AI 的交接要求
- type: list
  items:
  - 每一课都**从学生真实的偏差出发**：先让学生按自己的方式写，保存原始写法。
  - 每一课都要把**两种语言的条件**并排摆出来，并用"英语听者"实验让学生看到：按母语条件写出的句子，在目标语言的条件下会**丢掉什么**。
  - 每一课都要有一个"照镜子"的问题：反方向的搬运同样有损失。
  - 第一课已经完成"骨架规则"的建立，以及自创记号到 it、大名词主语的交接。以后的课**不再使用自创记号**，直接引用"骨架规则"和"英语听者"。
  - 每课至少保留一个问题交接点，并设计至少一道母语逻辑可能落空的、有区分力的预测题。
  - 学生版不得照抄教师版的归纳；教师心里的机制也只是临时模型。
- type: note
  tone: green
  title: 注意：
  text: 本课改变的是学生对英语形式的理解和接受，不能代替练习。要把骨架规则变成说话时的习惯，还需要后续从情境出发、在时间压力下的大量练习。
