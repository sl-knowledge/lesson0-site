- file: jp/l3/page-1.md
  title: 从第二课留下的问题出发
  head: 第三课 · 从第二课留下的问题出发
  blocks:
  - type: note
    tone: green
    title: ''
    text: 中文母语者学习日语 · 学生版 v1 先写下自己的猜想，再翻到下一页核对。你不必每次猜对，也不必问出老师预设的问题。
  - type: para
    text: 上一课，我们发现了三组真实的日语词。**左边是原来的形式，右边是过去的形式**：
  - type: table
    rows:
    - - '**見る**（みる / miru）'
      - '**見た**（みた / mita）'
      - 看 → 看了
    - - '**食べる**（たべる / taberu）'
      - '**食べた**（たべた / tabeta）'
      - 吃 → 吃了
    - - '**帰る**（かえる / kaeru）'
      - '**帰った**（かえった / kaetta）'
      - 回去 → 回去了
    headers:
    - 原来的形式
    - 过去的形式
    - 中文意思
  - type: ask
    label: 观察 1
    text: 这三组词有什么共同点？又有什么不同？
  - type: write
    label: 我的观察：
    lines: 1
  - type: ask
    label: 我的问题 2
    text: 如果由你决定下一步研究什么，你想问什么？
  - type: write
    label: 我的问题：
    lines: 1
  - type: para
    text: '**问题从哪里来？** 是哪一组词或哪种差别，让你想到这个问题？'
  - type: write
    label: 我的理由：
    lines: 1
  - type: note
    tone: green
    title: ''
    text: 先保留你的问题。如果你暂时没有想到，老师可以给一点线索。下面提供的是其中一条可以继续探索的路线，不要求你放弃自己的问题。
  pager: 从第二课留下的问题出发
- file: jp/l3/page-2.md
  title: 找一个“看起来很像”的新词
  head: 第三课 · 找一个“看起来很像”的新词
  blocks:
  - type: para
    text: 你已经知道：**見る（みる / miru）→ 見た（みた / mita）**。
  - type: label
    text: 现在有一个新词：
  - type: table
    rows:
    - - '**切る**'
      - きる / kiru
      - 切、剪
    headers:
    - 新词
    - 读音
    - 意思
  - type: ask
    label: 观察 3
    text: '`miru` 和 `kiru` 的结尾是不是很像？如果只看它们的读音，能不能想到一个猜法？'
  - type: ask
    label: 预测 4
    text: 如果“切了／剪了”要用过去的形式，你猜 **切る** 会变成什么？
  - type: write
    label: 我猜：
    lines: 1
  - type: ask
    label: 依据 5
    text: 你为什么这样猜？你是拿它和哪个旧词比较的？
  - type: write
    label: 我的依据：
    lines: 1
  - type: list
    marker: checkbox
    label: 把握：
    items:
    - 很有把握
    - 有一点把握
    - 还不确定
  - type: ask
    label: 翻页之前，再问自己一句
    text: 如果我猜错了，究竟说明哪一条原来的想法可能需要修改？
  - type: write
    label: ''
    lines: 1
  - type: note
    tone: green
    title: ''
    text: 没有把握也没关系。能够说清楚“我依据什么猜、哪里还不确定”，比盲目写一个答案更重要。
  pager: 找一个“看起来很像”的新词
