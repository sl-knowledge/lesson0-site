    label: 我目前认为：
    lines: 1
  - type: write
    label: ''
    lines: 1
  - type: label
    text: 暂时别急着问老师“正确规则是什么”
  - type: ask
    label: 我的新问题 8
    text: 你还想比较哪两个词，来判断这到底是偶然差异，还是两种可以重复出现的变化方式？
  - type: write
