- file: en/l1/page-1.md
  title: 先按你自己的方式写
  head: 英语第一课 · 先按你自己的方式写
  blocks:
  - type: note
    tone: green
    title: ''
    text: "今天不背单词，也不背语法。先按你自己的方式写，再一起看看会发生什么。 \n我们只想弄明白一件事：**同一个意思，为什么英语要换一种写法？**"
  - type: hr
  - type: note
    tone: green
    title: 可能用到的词
    text: here = 这里　cold = 冷　government = 政府　react = 反应　slow / slowly = 慢　people = 人们　angry = 生气的　rain
      = 下雨
  - type: question
    label: 小问题
    num: '1'
    text: 把下面三句话写成英语。写你觉得最自然的就行，不用担心对错。
  - type: para
    text: ① 这里很冷。 → [[blank]] ② 政府反应太慢，老百姓很生气。 → [[blank]] ③ 下雨了。 → [[blank]]
  - type: hint
    text: 先写下来，再往下看。
  - type: step
    label: 第 2 步
    title: 两种语言，两套条件
  - type: table
    rows:
    - - '**词**'
      - 永远不变形
      - 词上带"标签"：时间、单复数……
    - - '**一句话怎么组织**'
      - 像流水，一段一段往下说
      - 像骨架，先定一个主语和一个主要动词
    - - '**不需要的成分**'
      - 可以不说
      - 骨架上的位置必须填满
    - - '**听的人靠什么**'
      - 靠共同知道的背景，自己补上
      - 靠句子里明明白白的信号
    headers:
    - ''
    - 中文的条件
    - 英语的条件
  - type: para
    text: 两套条件都是好办法。可是，**按一套条件写出来的句子，放到另一套条件下，会发生什么？**
  - type: hr
  pager: 先按你自己的方式写
- file: en/l1/page-2.md
  title: 当一回"英语听者"
  head: 英语第一课 · 当一回"英语听者"
  blocks:
  - type: para
    text: 想象一个只按英语条件理解句子的人。他听句子时，会先找主语和主要动词；骨架上的每个位置，他都等着被填上；他只靠句子里的信号，不靠"心照不宣"。
  - type: para
    text: 很多中文母语者会这样写（也看看你自己的写法）：
  - type: para
    text: '**A. Here is very cold.**'
  - type: para
    text: '**B. Government react too slow, people very angry.**'
  - type: question
    label: 小问题
    num: '2'
    text: 英语里 "Here is…" 通常用来递上或介绍一样东西，比如 "Here is your coffee"。英语听者听到 A，会以为接下来要出现什么？
  - type: write
    label: ''
    lines: 1
  - type: question
    label: 小问题
    num: '3'
    text: 听完 B，英语听者能确定下面这些吗？
  - type: table
    rows:
    - - 这是过去的事、现在的事，还是一直这样？
      - '[ ]'
      - '[ ]'
    - - 说的是哪一个政府？
      - '[ ]'
      - '[ ]'
    - - '"反应慢"和"很生气"是什么关系？'
      - '[ ]'
      - '[ ]'
    headers:
    - 问题
    - 能
    - 不能
  - type: para
    text: 在中文里，没说的东西，听的人会自己补上。在英语里，**空着的位置不是"没说"：要么被听错，要么信息真的丢了。**
  - type: step
    label: 第 3 步
    title: 按英语的条件重新说
  - type: note
    tone: green
    title: 骨架规则只有三条
    text: ''
  - type: list
    marker: ordered
    items:
    - 每句话必须有一个**主语**，放在最前面。
    - 每句话只能有一个**主要动词**，紧跟在主语后面。
    - 骨架上的位置**不能空着**。没有合适的东西，也得放一个进去。
  - type: question
    label: 小问题
    num: '4'
    text: '"这里很冷"和"下雨了"，都没有一个"东西"可以当主语。按规则 ③，主语的位置放什么？'
  - type: para
    text: 主语 [[blank]]　　主要动词 [[blank]]　　其他 [[blank]]
  - type: hint
    text: 提示：你可以自己造一个"占位的小记号"，比如 ○。
  - type: question
    label: 小问题
    num: '5'
    text: 只用一句话（一个主语、一个主要动词）说"政府反应太慢，老百姓很生气"。
  - type: para
    text: 主语 [[blank]]　　主要动词 [[blank]]　　其他 [[blank]]
  - type: hint
    text: 提示：能不能把"政府反应太慢"这整件事变成**一个东西**，放进主语的位置？
  - type: hr
  pager: 当一回"英语听者"
- file: en/l1/page-3.md
  title: 原来，英语就是这样说的！
  head: 英语第一课 · 原来，英语就是这样说的！
  blocks:
  - type: para
    text: ① **It is cold here.** 这里很冷。（it 没有意思，只负责占住主语的位置）
  - type: para
    text: ② **It is raining.** 下雨了。
  - type: para
    text: ③ **The government's slow response angered the public.** （主语："政府迟缓的反应"；动词：使……生气）
  - type: para
    text: ③' **People were angry because the government reacted too slowly.** （另一种说法：用 because 把关系说出来）
  - type: question
    label: 小问题
    num: '6'
    text: 把你的发明和英语对上号，然后就不再用自己的记号了。
  - type: table
    rows:
    - - 占位的小记号：[[blank]]
      - '[[blank]]'
    - - 装进主语的那件事：[[blank]]
      - '[[blank]]'
    headers:
    - 我自己发明的
    - 英语里真正的说法（亲手抄写）
  - type: question
    label: 小问题
    num: '7'
    text: 回到第 2 页的小问题 3。英语的这些写法，分别把哪样东西"找回来"了？
  - type: para
    text: were（过去的事）→ 找回了 [[blank]] because → 找回了 [[blank]] the government → 找回了 [[blank]]
  - type: note
    tone: green
    title: 这就是英语。
    text: 在"骨架必须填满、听的人只靠信号"的条件下，英语长成了这个样子：用 it 占位，用词上的标签说清时间，用 because 说清关系，用一个大名词装下整件事。按中文的样子写也不是不行，但会丢掉这些东西。这是我们今天的初步发现，英语还有更多细节，以后慢慢发现。
  - type: step
    label: 第 4 步
    title: 照一照镜子
  - type: ask
    label: 小问题 8
    text: 有人把 ③ 直译成中文："政府的迟缓的反应使老百姓生气了。"你听着怎么样？按英语的样子写中文，中文丢掉了什么？
  - type: write
    label: ''
    lines: 1
  - type: hint
    text: 提示：想想，中文原来那句"政府反应太慢，老百姓很生气"，好在哪里？
  - type: step
    label: 第 5 步
    title: 你来试试
  - type: note
    tone: green
    title: 新词
    text: quiet = 安静　dark = 黑　is getting = 正在变得　sick = 生病的　didn't come to school = 没来上学　because = 因为
  - type: para
    text: '"这里很安静。" → [[blank]]　把握：[ ] 高　[ ] 中　[ ] 低'
  - type: para
    text: '"天黑了。" → [[blank]]　把握：[ ] 高　[ ] 中　[ ] 低'
  - type: para
    text: '"他病了，没来上学。" → [[blank]]　把握：[ ] 高　[ ] 中　[ ] 低'
  - type: label
    text: ★ 挑战（选做）
  - type: list
    marker: ordered
    items:
    - 今天你是用什么办法弄明白英语为什么这样写的？用一句话写下来。
    - 找一句你以前写过、或者常听人说的"中文式英语"。当一回英语听者：它丢掉了什么？
  - type: hr
  pager: 原来，英语就是这样说的！
- file: en/l1/page-4.md
  title: 最后一个小问题
  head: 英语第一课 · 最后一个小问题
  blocks:
  - type: label
    text: 学完以后，你还好奇什么？
  - type: write
    label: ''
    lines: 1
  - type: hint
    text: 想不到也没关系。比如可以问："英语为什么一定要分 he 和 she？""单复数是不是也为了不让听的人弄错？"
  - type: hr
  - type: para
    text: 按中文的样子写英语，英语会丢东西；按英语的样子写中文，中文也会丢东西。**每种语言都在自己的条件下长成了最合适的样子。觉得别扭的时候，先问一句：在它的条件下，这样写保住了什么？**
  pager: 最后一个小问题
