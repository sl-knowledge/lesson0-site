title: 教师用：问题生成支架与核查
file: teacher/guide.md
lead: 这一页是第零课的教师后台：预设路径、逐级提示与示范答案。学生不应预先看到本页内容。
blocks:
  - type: banner
    tone: teacher
    title: 仅教师使用 · 请勿投屏或分发本页链接
    text: 本页包含预设教学路径、逐级提示与示范答案。站点是纯静态页面，没有访问控制：请不要向学生投屏此页，也不要把本页链接发给学生。

  - type: heading
    level: 2
    text: 本课真正的学习目标
  - type: list
    items:
      - 中文母语者运用“拼音能记录读音；汉字能辅助区分同音异义”的已有框架，理解日语表音写法与汉字的协作。
      - 学生自己发现：一个日语词不一定全由汉字组成；可能是汉字+平假名、纯平假名、纯片假名、纯汉字，甚至混合三类文字。看见汉字不等于词语结束。
      - 学生至少一次在教师停止发问后，自行提出一个有依据、可以被事实检验的新问题，并说明该问题从哪里来。
      - 发现单个汉字的读法可能随词语变化，但不在本课背“音读、训读”。

  - type: heading
    level: 2
    text: 教师后台的知识与纪律
  - type: list
    items:
      - 表音假名与日语罗马字可记录读音；现代日语实际书写还使用汉字，但不要在开头预告汉字这一关键发现。
      - 这是一条**教学理解路径**，不是实际历史演变顺序。历史上日本引入汉字，假名后来由汉字演变形成。
      - kisha 的现代日语例：記者、汽車，真实同音词，口语通过语境理解；汉字主要提升书面辨义。
      - 見る、食べる，汉字后的 る、べる 是同一个词的书写成分。不要提前把学生引入动词活用技术术语。
      - これ（纯平假名）、テレビ（纯片假名）、消しゴム（三类书写同在一个词）用来改变“一个词就得对应一套文字”的假设；这是观察词界的材料，不要求背诵拼写。
      - “同一个字有不同读音”确实存在，但也有很多常见可学的规律；不能说日语随机/全靠死记硬背，也不能假装能由字形推导所有读音。

  - type: heading
    level: 2
    text: 关键：在第三页暂停，把问题提出权移交给学生
  - type: para
    text: 第一轮：老师只问“你接下来想知道什么？”并允许安静思考、写字、画问号，哪怕问题和教师预设的方向不同。
  - type: para
    text: 如果不能生成问题，逐级提供最小支架，一旦学生开始问即停：
  - type: table
    caption: 支架阶梯（自上而下逐级加码，学生一开始提问即停止加码）
    headers: [层级, 教师可以这样说, 学生该做什么]
    rows:
      - [第一轮, 只问“你接下来想知道什么？”, 允许安静思考、写字、画问号；问题和预设方向不同也要记录]
      - [轻提示, “现在你刚掌握了一种新办法。你会想在哪种新情况试一试？”, 学生开始问即停]
      - [较明确, “刚才两个日语词都完全写成汉字了。你还会想研究哪类不同的词？”, 学生开始问即停]
      - [半句支架, “我现在知道这两个词能全部写成汉字，那么其他词是不是也……”（让学生完成）, 把句子说完]
      - [示范（必要时）, “我想问：是不是所有日语词都能写成汉字？我会找两个新的词看看。”, 要求学生提出一个**不完全相同**的相邻问题，并说出问题来源]
  - type: admonition
    kind: warning
    title: 不要强制学生恰好提出预设问题
    text: |
      **不要强制学生恰好提出“能否全部写成汉字”。** 若学生问“为什么是两种假名”或“同一字会不会有两种声音”，同样记录并按证据可用性分支。主线可由教师轻轻收束，但不要伪装成学生自己提出。

  - type: heading
    level: 2
    text: 课堂中观察什么
  - type: list
    marker: checkbox
    items:
      - 学生在没有教师点名时，是否自己发起下一个可检验的问题？
      - 问题是否有具体来源（前一例证、现有假设、类比、边界）？
      - 学生是否提出一个可比较的例子/求证方式？
      - 学生面对“混合书写”能否自发修正“汉字后是另一个词”的切分假设？
      - 第六页只是拓展材料，学生吃力时可以跳过；不要为讲完内容牺牲自主提问时间。

  - type: heading
    level: 2
    text: 站点页面与教学动作对照
  - type: para
    text: 下面这张表把本课的教学动作对到站点页面上，方便课堂上翻页：左边是学生看到的内容，右边是教师在该页的动作。
  - type: table
    headers: [站点页面, 这一页的教学动作]
    rows:
      - - {to: student/page-1.md, text: "第 1 页 · 先从你熟悉的中文开始"}
        - 只建立“表音写法记读音”的共同起点，不预告汉字这一关键发现
      - - {to: student/page-2.md, text: "第 2 页 · 同一个读音，可能有两个意思吗？"}
        - 先用中文的“权利／权力”做对照，再交出“用汉字区分意思”这把工具；等学生写完两个写法再翻页
      - - {to: student/page-3.md, text: "第 3 页 · 日语真的采用了类似的办法吗？"}
        - "**关键停顿页**：对照学生上一页写下的想法，给出 記者／汽車，然后停止发问，把问题提出权交给学生"
      - - {to: student/page-4.md, text: "第 4 页 · 再看两个词，和刚才一样吗？"}
        - 观察学生能否自发修正“汉字后是另一个词”的切分假设；不引入动词活用术语
      - - {to: student/page-5.md, text: "第 5 页 · 一个词，可以有多少种模样？"}
        - 用 5 个真实词推翻“一个词对应一套文字”的假设；只看文字组合，不要求背读音
      - - {to: student/page-6.md, text: "第 6 页 · 最后，一个小小的自测"}
        - 拓展材料：学生吃力时可以跳过，不要为讲完内容牺牲自主提问时间

  - type: heading
    level: 2
    text: 快速事实核验参考
  - type: table
    headers: [条目, 出处]
    rows:
      - [Japan Foundation Irodori 对日语多种文字系统的介绍, "[irodori.jpf.go.jp · TIPS_all.pdf](https://www.irodori.jpf.go.jp/assets/data/TIPS_all.pdf)"]
      - [漢字ペディア：見る, "[kanjipedia.jp · 0001902300](https://www.kanjipedia.jp/kotoba/0001902300)"]
      - [漢字ペディア：食べる, "[kanjipedia.jp · 0003543700](https://www.kanjipedia.jp/kotoba/0003543700)"]
      - [日本同音异义词课堂案例（記者、汽車、帰社）, "[school.setagaya.ed.jp · weblog](https://school.setagaya.ed.jp/tan/weblog/136213077?tm=20261006125411)"]
      - [Cambridge 日英词典：消しゴム, "[dictionary.cambridge.org](https://dictionary.cambridge.org/dictionary/japanese-english/%E6%B6%88%E3%81%97%E3%82%B4%E3%83%A0)"]
      - [CJK Dictionary Institute 文字变体与混合书写, "[cjki.org · japvar](https://cjki.org/reference/japvar.htm)"]

  - type: hr
