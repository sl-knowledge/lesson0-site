# 首页内容真源
title: 第零课 · 同一个声音，可以怎么写？

cover:
  eyebrow: 第零课 · 中文母语者学习日语 · 试教稿 v1
  title: 同一个声音，可以怎么写？
  lead: 今天不背日语词，也不背五十音。做几个小观察，看看一种语言的声音可以怎样写下来——然后，把“下一个问题”交给你自己提出。

blocks:
  - type: buttons
    items:
      - {text: 进入学生版 · 6 页, to: student/index.md, primary: true}
      - {text: 下载打印版 PDF, to: assets/downloads/lesson0-student-handout-v1.pdf, asset: true}

  - type: heading
    level: 2
    text: 这一课在做什么
  - type: cards
    cols: 3
    items:
      - big: 观察
        label: 同一个声音可以有三种写法：inu、いぬ、イヌ。
      - big: 工具
        label: 汉字不记读音，但能帮读者分清同音词：記者／汽車。
      - big: 交棒
        label: 第三页停下来，由你自己提出下一个问题，并说清怎么检验它。

  - type: heading
    level: 2
    text: 给老师
