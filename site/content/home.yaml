title: 先观察，再提问
cover:
  eyebrow: 中文母语者学习语言 · 观察式试教站点
  title: 先观察，再提问
  lead: 每一课都不背词条：从你每天都在用的母语出发，先做一点观察，再提出自己的问题，然后拿真实的材料去检验它。

blocks:
  - type: heading
    level: 2
    text: 日语课程
  - type: para
    text: 四节课，一条主线：同一个声音能写成几种样子 → 换了位置怎么知道谁在看 → 自己提出的问题怎么检验 → 看起来很像的词，是不是同一条规则。
  - type: linkcard
    eyebrow: 日语 · 第零课
    title: 同一个声音，可以怎么写？
    desc: 6 页学生讲义 · 从「quánlì」三种写法开始认识日语的表音与表意
    to: jp/l0/index.md
  - type: linkcard
    eyebrow: 日语 · 第一课
    title: 一句话，为什么能有不同说法？
    desc: 4 页学生讲义 · 从中文语序走到日语的「が」「を」，并完成一次符号交接
    to: jp/l1/index.md
  - type: linkcard
    eyebrow: 日语 · 第二课
    title: 你发现了一个新问题吗？
    desc: 6 页学生讲义 · 先写预测再核对，把「我发现了什么」变成「我该问什么」
    to: jp/l2/index.md
  - type: linkcard
    eyebrow: 日语 · 第三课
    title: 看起来很像，就一定按同一条规则变化吗？
    desc: 6 页学生讲义 · 自己挑对照词、自己提可检验的问题、自己修正原来的想法
    to: jp/l3/index.md

  - type: heading
    level: 2
    text: 英语课程
  - type: para
    text: 从中文出发，看英语的句子是怎么搭起来的：不背单词，先看清骨架。
  - type: linkcard
    eyebrow: 英语 · 第一课
    title: 按中文的方式写英语，会丢掉什么？
    desc: 4 页学生讲义 · 先按自己的方式写，再当一回「英语听者」
    to: en/l1/index.md

  - type: heading
    level: 2
    text: 给老师
  - type: linkcard
    eyebrow: 仅教师
    title: 教师区
    desc: 每一课的预设教学路径、逐级提示与示范答案
    to: teacher/index.md
  - type: note
    tone: amber
    title: 教师区没有访问控制
    text: 站点是纯静态页面：任何拿到链接的人都能打开教师区。请勿投屏，也不要分发相关链接。

  - type: heading
    level: 2
    text: 关于这个站点
  - type: note
    title: 纯静态 · 可离线 · 可打印
    text: |
      内容真源是 YAML，构建产物是静态 HTML/CSS。除 Material 主题自带的搜索与翻页外，没有任何自写 JavaScript；没有统计脚本，没有 Cookie，也不向外部站点发起请求。每一页都按 A4 讲义排版，浏览器直接打印即可分发。

